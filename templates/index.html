{% extends "base.html" %} 
{% block title %} Home {% endblock %} 
{% block content%}
<section>
 <h2>Welcome to My Web Programming Portfolio</h2>  <!-- added from the existing index.html file in week 3 -->
</section>
<section>
 <h2>Weekly Work</h2>
 <!-- Each week you add a link here 
  to that week's page or feature. -->
 <ul class="weekly-list">
  {% for item in weekly_work %}
  <li>
   <a href="{{ item.url }}">Week 
      {{ item.week }} — {{ item.title }}</a> 
  </li>
  {% else %}
  <li>Week 1 — live site launched.</li>
  {% endfor %}
 </ul>
</section>
{% endblock %}
